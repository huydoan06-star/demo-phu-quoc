<!doctype html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Healing Spa – Cua Lap, Phu Quoc (sample page)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="demo" id="demoBar" data-i18n="demo"></div>

<header class="site" id="site">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"></a>
    <nav class="nav" aria-label="Main">
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#offer" data-i18n="nav_services"></a>
      <a href="#gallery" data-i18n="nav_gallery"></a>
      <a href="#visit" data-i18n="nav_visit"></a>
    </nav>
    <div class="lang" id="lang">
      <button type="button" aria-haspopup="true" aria-expanded="false"><svg class="i"><use href="#i-globe"/></svg><span id="langCode">VI</span></button>
      <ul id="langList"></ul>
    </div>
    <a class="btn btn-line hdr-cta cta-main" href="#book" data-i18n="cta_book"></a>
    <button class="burger" id="burger" type="button" aria-label="Menu"><span></span><span></span></button>
  </div>
</header>
<div class="drawer" id="drawer">
  <a href="#about" data-i18n="nav_about"></a>
  <a href="#offer" data-i18n="nav_services"></a>
  <a href="#gallery" data-i18n="nav_gallery"></a>
  <a href="#reviews" data-i18n="nav_reviews"></a>
  <a href="#visit" data-i18n="nav_visit"></a>
  <a href="#book" class="nav-book" data-i18n="nav_book"></a>
  <div class="meta" id="drawerMeta"></div>
</div>

<main id="top">
  <section class="hero" id="hero" style="padding:0">
    <picture id="heroPic"></picture>
    <div class="wrap">
      <div class="eyebrow" id="eyebrow" data-i18n="eyebrow"></div>
      <h1 id="heroTitle"></h1>
      <p class="tag" id="heroTag"></p>
      <div class="ctas on-dark">
        <a class="btn btn-ivory cta-main" href="#book" data-i18n="cta_book"></a>
        <a class="link" href="#offer"><span data-i18n="cta_explore"></span><svg class="i"><use href="#i-arrow"/></svg></a>
      </div>
      <div class="meta"><span class="dot" id="openDot"></span><span id="openTxt"></span></div>
    </div>
    <div class="scrollcue" data-i18n="scroll"></div>
  </section>

  <section id="about"><div class="wrap about">
    <figure class="rv"><img id="aboutImg" alt="" loading="lazy" width="960" height="1200"></figure>
    <div class="rv d1">
      <span class="kicker" data-i18n="about_kicker"></span>
      <h2 id="aboutTitle"></h2>
      <div id="aboutText"></div>
      <div class="sig" id="aboutSig"></div>
    </div>
  </div></section>

  <section class="why"><div class="wrap center">
    <span class="kicker rv" data-i18n="why_kicker"></span>
    <div class="why-grid" id="whyGrid"></div>
  </div></section>

  <section id="offer"><div class="wrap">
    <div class="center rv">
      <span class="kicker" data-i18n="services_kicker"></span>
      <h2 data-i18n="services_title"></h2>
      <p class="note" data-i18n="price_note"></p>
    </div>
    <div id="offerBody"></div>
  </div></section>

  <section id="gallery" style="padding-top:0"><div class="wrap">
    <div class="center rv">
      <span class="kicker" data-i18n="gallery_kicker"></span>
      <h2 data-i18n="gallery_title"></h2>
    </div>
    <div class="gal" id="gal"></div>
  </div></section>

  <section class="reviews" id="reviews"><div class="wrap center">
    <span class="kicker rv" data-i18n="reviews_kicker"></span>
    <div id="revBody" class="rv d1"></div>
  </div></section>

  <section class="visit on-dark" id="visit"><div class="wrap visit-grid">
    <div class="rv">
      <span class="kicker" data-i18n="visit_kicker"></span>
      <h2 data-i18n="visit_title"></h2>
      <div class="vlist">
        <div class="vrow"><svg class="i"><use href="#i-clock"/></svg><div><b data-i18n="hours"></b><span id="vHours"></span></div></div>
        <div class="vrow" id="vAddrRow"><svg class="i"><use href="#i-pin"/></svg><div><b data-i18n="address"></b><span id="vAddr"></span></div></div>
        <div class="vrow vbr" id="vBranches" hidden></div>
        <div class="vrow"><svg class="i"><use href="#i-phone"/></svg><div><b data-i18n="phone"></b><span id="vPhone"></span></div></div>
      </div>
      <div class="vbtns">
        <a class="btn btn-ivory" id="dirBtn" target="_blank" rel="noopener"><svg class="i"><use href="#i-compass"/></svg><span data-i18n="directions"></span></a>
        <a class="btn btn-line" id="callBtn"><svg class="i"><use href="#i-phone"/></svg><span data-i18n="call"></span></a>
      </div>
      <div class="dsteps" id="dirSteps" hidden></div>
      <div class="chats" id="chats"></div>
      <div class="qr"><img src="qr.png" alt="QR" width="84" height="84" loading="lazy"><span data-i18n="qr_title"></span></div>
    </div>
    <div class="mapbox rv d1" id="mapBox"><div class="ph"><svg class="i" style="width:40px;height:40px"><use href="#i-pin"/></svg></div></div>
  </div></section>

  <section class="book" id="book"><div class="wrap">
    <div class="center rv">
      <span class="kicker" data-i18n="book_kicker"></span>
      <h2 data-i18n="cta_book"></h2>
      <p class="lead" data-i18n="book_sub"></p>
    </div>
    <div class="ticket rv" id="ticket">
      <div class="t-head">
        <div class="brand-s" id="tBrand"></div>
        <h3 data-i18n="book_title"></h3>
        <div class="ref"><span><span data-i18n="ok_ref"></span> <span id="refNo"></span></span></div>
      </div>
      <div id="tInner"></div>
    </div>
  </div></section>
</main>

<footer class="ft">
  <div class="wrap">
    <div class="ft-grid">
      <div><div class="brand" id="ftBrand"></div><p id="ftTag"></p></div>
      <div><h5 data-i18n="footer_contact"></h5><p id="ftPhone"></p><p id="ftAddr"></p></div>
      <div><h5 data-i18n="hours"></h5><p id="ftHours"></p></div>
      <div><h5 data-i18n="footer_lang"></h5><div class="langs" id="ftLangs"></div></div>
    </div>
    <div class="ft-bot"><span id="ftCopy"></span><span><span data-i18n="footer_demo"></span> · <span data-i18n="footer_photos"></span></span></div>
  </div>
  <div class="designer" id="designer" hidden>
    <div class="wrap">
      <span class="dz-t" data-i18n="designer_by"></span>
      <div class="dz-l" id="dzLinks"></div>
    </div>
  </div>
</footer>

<div class="dock" id="dock">
  <a class="btn call" id="dockCall" aria-label="Call"><svg class="i"><use href="#i-phone"/></svg></a>
  <a class="btn btn-moss go cta-main" href="#book" data-i18n="cta_book"></a>
</div>
